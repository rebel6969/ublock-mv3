name: Build extension

# Produces a loadable extension as a downloadable artifact, so users do not need
# Node or a build step -- they download a zip and load it unpacked.
#
# Builds always use config/default.json (no personal data): the workflow never
# sees a personal uBO backup, and tools/lib/backup.mjs falls back to defaults
# when none is present.

on:
  push:
    branches: [ main ]
  pull_request:
  release:
    types: [ published ]
  # Run on demand from the Actions tab, e.g. to check that a change upstream in
  # the filter lists has not broken the build.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install google-re2
        # Validates regexFilter patterns against Chromium's 2KB compiled-memory
        # budget. The npm re2 package cannot express max_mem; this binding can.
        run: pip install google-re2

      - name: Vendor uBlock Origin sources
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run vendor

      - name: Determine version
        # Local builds, push artifacts and release packages use package.json.
        # Reject release tags that would give the package a different version.
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          RELEASE_VERSION="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_EVENT_NAME" = release ] && [ "$RELEASE_TAG" != "v$RELEASE_VERSION" ]; then
            echo "Release tag does not match package.json version" >&2
            exit 1
          fi
          echo "EXT_VERSION=$RELEASE_VERSION" >> "$GITHUB_ENV"
          echo "building version $RELEASE_VERSION"

      - name: Build
        run: npm run build:all

      - name: Confirm the build carries no personal data
        # tools/assemble.mjs records where the config came from. A build made
        # from someone's uBO backup embeds their whitelist, so publishing one
        # would leak it. Fail loudly rather than ship it.
        run: |
          node -e "
            const p = require('./extension/data/build-provenance.json');
            console.log(JSON.stringify(p, null, 2));
            if (p.publishable !== true) {
              console.error('refusing to publish: build used a personal config');
              process.exit(1);
            }
          "

      - name: Package
        run: |
          cd extension
          zip -qr ../ublock-mv3.zip .
          cd ..
          ls -lh ublock-mv3.zip

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: ublock-mv3
          path: ublock-mv3.zip
          retention-days: 30

      - name: Attach to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.release.tag_name }}" ublock-mv3.zip --clobber
